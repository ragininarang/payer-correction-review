modules:
  jira:issuePanel:
    - key: payer-correction-proof-panel
      resource: proof-ui
      resolver:
        function: proof-resolver
      title: Payer correction proof
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: proof-resolver
      handler: forge/index.handler
    - key: sql-migration
      handler: forge/index.runRecovery
    - key: platform-spike-worker
      handler: forge/index.runPlatformSpikeWorker
      timeoutSeconds: 120
  consumer:
    - key: platform-spike-consumer
      queue: platform-spike-queue
      function: platform-spike-worker
  scheduledTrigger:
    - key: sql-schema-check
      function: sql-migration
      interval: hour
  sql:
    - key: main
      engine: mysql
resources:
  - key: proof-ui
    path: static/build
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
  external:
    fetch:
      backend:
        - address: https://api.openai.com
          inScopeEUD: false
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/d542f55c-1bd7-45bc-ba80-8e8e85edc010
